[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "researcher-rag-eval"
version = "0.1.0"
description = "Reproducible evaluation of evidence-grounded RAG answers."
readme = "README.md"
requires-python = ">=3.12"
authors = [
  { name = "Verena Teresa" },
]
keywords = [
  "rag",
  "evaluation",
  "groundedness",
  "citations",
  "abstention",
  "reproducibility",
]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
]

dependencies = []

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.8",
]

[project.scripts]
researcher-rag-eval = "researcher_rag_eval.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]